<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" role="img" aria-label="macula-lazymesh system context">
<title>macula-lazymesh system context</title>
<style>
.t-name { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; }
.t-desc { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 12.5px; }
.t-rel { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 11.5px; paint-order: stroke; stroke-width: 4px; stroke-linejoin: round; }
.t-code { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 13px; font-weight: 600; }
.t-type { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; }
.t-bound { font-family: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 12px; font-weight: 600; }
.t-leg { font-family: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, Helvetica, Arial, sans-serif; font-size: 12px; }
.edge { fill: none; stroke-width: 1.25; }
.edge-later { fill: none; stroke-width: 1.25; stroke-dasharray: 5 4; }
.bg { fill: #FFFFFF; }
.b-sys { fill: #F5E9CC; stroke: #A56F0A; stroke-width: 2; }
.b-per { fill: #E3EBF2; stroke: #3B5B7A; stroke-width: 1.25; }
.b-mac { fill: #E6E4EE; stroke: #5E5A78; stroke-width: 1.25; }
.b-ext { fill: #ECEFED; stroke: #8A9791; stroke-width: 1.25; }
.b-cmp { fill: #FFFFFF; stroke: #8A9791; stroke-width: 1.25; }
.b-later { fill: none; stroke: #8A9791; stroke-width: 1.25; stroke-dasharray: 5 4; }
.bound { fill: none; stroke: #B3BDB8; stroke-width: 1; }
.head { fill: #3B5B7A; }
.t-name, .t-code { fill: #16201D; }
.t-type, .t-bound, .t-leg { fill: #66736E; }
.t-desc { fill: #34413C; }
.t-rel { fill: #66736E; stroke: #FFFFFF; }
.edge, .edge-later { stroke: #8A9791; }
.arrowhead { fill: #8A9791; }
@media (prefers-color-scheme: dark) {
.bg { fill: #171F1C; }
.b-sys { fill: #3A2E13; stroke: #E3AA3C; }
.b-per { fill: #1D2A36; stroke: #8EB4D8; }
.b-mac { fill: #26243A; stroke: #A9A4C8; }
.b-ext { fill: #1C2421; stroke: #7D8B85; }
.b-cmp { fill: #171F1C; stroke: #7D8B85; }
.b-later { stroke: #7D8B85; }
.bound { stroke: #4A5752; }
.head { fill: #8EB4D8; }
.t-name, .t-code { fill: #E6ECE9; }
.t-type, .t-bound, .t-leg { fill: #93A09A; }
.t-desc { fill: #C3CDC8; }
.t-rel { fill: #93A09A; stroke: #171F1C; }
.edge, .edge-later { stroke: #7D8B85; }
.arrowhead { fill: #7D8B85; }
}
</style>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L10 5L0 10z"/></marker></defs>
<rect class="bg" x="0" y="0" width="1000" height="640"/>
<rect class="b-per" x="40" y="30" width="270" height="116" rx="10"/>
<circle class="head" cx="66" cy="54" r="9"/>
<text class="t-name" x="84" y="58">Operator</text>
<text class="t-type" x="84" y="76">[Person]</text>
<text class="t-desc" x="56" y="100">Watches rooms, rings and presence;</text>
<text class="t-desc" x="56" y="116">talks to the agent, approves tool</text>
<text class="t-desc" x="56" y="132">calls, types realm names to join</text>
<rect class="b-ext" x="365" y="30" width="270" height="116" rx="10"/>
<text class="t-name" x="381" y="58">Controller program</text>
<text class="t-type" x="381" y="76">[External: Go or Python SDK]</text>
<text class="t-desc" x="381" y="100">Drives --headless over a unix</text>
<text class="t-desc" x="381" y="116">socket: input, events, rings, a</text>
<text class="t-desc" x="381" y="132">pre-tool hook gating every call</text>
<rect class="b-ext" x="690" y="30" width="270" height="116" rx="10"/>
<text class="t-name" x="706" y="58">LLM provider</text>
<text class="t-type" x="706" y="76">[External: HTTPS API]</text>
<text class="t-desc" x="706" y="100">DeepSeek (default), NVIDIA, Groq</text>
<text class="t-desc" x="706" y="116">(OpenAI-compatible) or Anthropic;</text>
<text class="t-desc" x="706" y="132">key from an api_key_file</text>
<rect class="b-ext" x="40" y="210" width="270" height="120" rx="10"/>
<text class="t-name" x="56" y="238">Web pages</text>
<text class="t-type" x="56" y="256">[External: http/https]</text>
<text class="t-desc" x="56" y="280">What the web_fetch tool reads:</text>
<text class="t-desc" x="56" y="296">bounded text, every address</text>
<text class="t-desc" x="56" y="312">checked by an SSRF guard</text>
<rect class="b-sys" x="365" y="210" width="270" height="120" rx="10"/>
<text class="t-name" x="381" y="238">lazymesh</text>
<text class="t-type" x="381" y="256">[Go binary: TUI + agent harness]</text>
<text class="t-desc" x="381" y="280">An agent whose only job is mesh</text>
<text class="t-desc" x="381" y="296">cooperation, with a lazygit-style</text>
<text class="t-desc" x="381" y="312">live view of rooms and rings</text>
<rect class="b-ext" x="690" y="210" width="270" height="120" rx="10"/>
<text class="t-name" x="706" y="238">npm registry</text>
<text class="t-type" x="706" y="256">[External system]</text>
<text class="t-desc" x="706" y="280">Serves @macula-io/mcp to npx;</text>
<text class="t-desc" x="706" y="296">its latest version, read by the</text>
<text class="t-desc" x="706" y="312">startup update check</text>
<rect class="b-ext" x="40" y="430" width="270" height="120" rx="10"/>
<text class="t-name" x="56" y="458">Prometheus scraper</text>
<text class="t-type" x="56" y="476">[External, optional]</text>
<text class="t-desc" x="56" y="500">Reads /metrics when</text>
<text class="t-desc" x="56" y="516">metrics_listen is set: turns, tool</text>
<text class="t-desc" x="56" y="532">calls, errors, tokens</text>
<rect class="b-mac" x="365" y="430" width="270" height="120" rx="10"/>
<text class="t-name" x="381" y="458">macula-mcp</text>
<text class="t-type" x="381" y="476">[Macula, @macula-io/mcp &gt;= 0.48.0]</text>
<text class="t-desc" x="381" y="500">The sole mesh tool source, a stdio</text>
<text class="t-desc" x="381" y="516">subprocess; macula-mcp-realm runs</text>
<text class="t-desc" x="381" y="532">realm joins outside the agent loop</text>
<rect class="b-mac" x="690" y="430" width="270" height="120" rx="10"/>
<text class="t-name" x="706" y="458">Macula mesh and realm</text>
<text class="t-type" x="706" y="476">[Macula infrastructure]</text>
<text class="t-desc" x="706" y="500">Stations and DHT, rooms, rings,</text>
<text class="t-desc" x="706" y="516">other agents; mcl-rag and mcl-graph</text>
<text class="t-desc" x="706" y="532">procedures; realm.macula.io</text>
<path class="edge" d="M310 100H328V236H365" marker-end="url(#a)"/>
<text class="t-rel" x="320" y="180" text-anchor="middle" transform="rotate(-90 320 180)">TUI</text>
<path class="edge" d="M500 146V210" marker-end="url(#a)"/>
<text class="t-rel" x="508" y="172">unix socket, NDJSON;</text>
<text class="t-rel" x="508" y="188">own user only</text>
<path class="edge" d="M610 210V178H825V146" marker-end="url(#a)"/>
<text class="t-rel" x="680" y="172">chat completions</text>
<path class="edge" d="M365 270H310" marker-end="url(#a)"/>
<text class="t-rel" x="337" y="290" text-anchor="middle">fetches</text>
<path class="edge" d="M635 270H690" marker-end="url(#a)"/>
<text class="t-rel" x="662" y="262" text-anchor="middle">version</text>
<text class="t-rel" x="662" y="290" text-anchor="middle">check</text>
<path class="edge" d="M310 490H346V310H365" marker-end="url(#a)"/>
<text class="t-rel" x="354" y="400">scrapes</text>
<path class="edge" d="M500 330V430" marker-end="url(#a)"/>
<text class="t-rel" x="508" y="366">spawns it with npx;</text>
<text class="t-rel" x="508" y="382">MCP over stdio; execs</text>
<text class="t-rel" x="508" y="398">macula-mcp-realm</text>
<path class="edge" d="M635 490H690" marker-end="url(#a)"/>
<text class="t-rel" x="662" y="482" text-anchor="middle">QUIC,</text>
<text class="t-rel" x="662" y="510" text-anchor="middle">HTTPS</text>
<rect class="b-sys" x="24" y="600" width="22" height="14" rx="3"/>
<text class="t-leg" x="54" y="612">In scope</text>
<rect class="b-per" x="110.8" y="600" width="22" height="14" rx="3"/>
<text class="t-leg" x="140.8" y="612">Person</text>
<rect class="b-mac" x="184.39999999999998" y="600" width="22" height="14" rx="3"/>
<text class="t-leg" x="214.39999999999998" y="612">Macula infrastructure</text>
<rect class="b-ext" x="357.0" y="600" width="22" height="14" rx="3"/>
<text class="t-leg" x="387.0" y="612">External system</text>
<rect class="b-cmp" x="490.0" y="600" width="22" height="14" rx="3"/>
<text class="t-leg" x="520.0" y="612">Container or component</text>
<rect class="b-later" x="669.2" y="600" width="22" height="14" rx="3"/>
<text class="t-leg" x="699.2" y="612">Planned, not built</text>
</svg>
