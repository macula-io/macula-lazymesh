name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fmt:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"

  vet:
    name: go vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...
      # .goreleaser.yml ships windows/amd64 and windows/arm64, and a unix-only
      # syscall in shared code compiles here and not there: this is the check
      # that would have caught cmd.SysProcAttr{Setpgid: true} in realmjoin.
      - name: cross-compile for windows
        run: GOOS=windows GOARCH=amd64 go build ./...

  test:
    name: go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Plain `go test ./...` already excludes internal/mcpclient's own
      # //go:build live file, which spawns a real macula-mcp subprocess
      # over npx and needs live mesh access -- not something to run
      # unattended in CI. Everything else (config, provider's DeepSeek
      # wire format via httptest, agent's tool-calling loop via fakes,
      # tui's mesh-state parsing against real captured JSON fixtures) is
      # a real offline test, not a stub.
      #
      # The coding profile's confined shell (#26) is proven on this runner,
      # not assumed: internal/confinedshell and cmd/lazymesh's shell tests
      # FAIL without a working bubblewrap, they never skip on Linux. A
      # runner that cannot confine fails this job.
      # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor,
      # so bwrap gets a namespace without the capabilities to set it up and
      # the self-test fails closed. CI loads Ubuntu's own
      # bwrap-userns-restrict profile, the one the README recommends: bwrap
      # may set up its namespace, and what it runs gets no capabilities and
      # no further namespaces. This proves the recommended path works with
      # our sandbox, on this runner.
      - name: install bubblewrap
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q bubblewrap apparmor-profiles
          sudo cp /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
      - run: go test ./...

  goreleaser-check:
    name: goreleaser build (snapshot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          # Builds every OS/arch combo and packages the archives, same
          # as a real release, without publishing anything -- catches a
          # broken .goreleaser.yml (or a build that only fails cross-
          # compiled) before it's discovered at actual release time.
          args: release --snapshot --clean

  shellcheck:
    name: shellcheck install.sh / uninstall.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ludeeus/action-shellcheck@master
        with:
          scandir: "."
          ignore_paths: dist

  powershell-parse:
    name: parse-check install.ps1 / uninstall.ps1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Syntax-only validation -- actually running install.ps1 would need
      # a real published release to download against, which isn't
      # available in this job. Catches the class of error a typo/paren
      # mismatch would cause without needing network access.
      - shell: pwsh
        run: |
          $allErrors = @()
          foreach ($f in @("install.ps1", "uninstall.ps1")) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($f, [ref]$null, [ref]$errors) | Out-Null
            $allErrors += $errors
          }
          if ($allErrors.Count -gt 0) {
            $allErrors | ForEach-Object { Write-Error $_ }
            exit 1
          }
