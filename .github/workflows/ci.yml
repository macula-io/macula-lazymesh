name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fmt:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: test -z "$(gofmt -l .)"

  vet:
    name: go vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...

  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build ./...

  test:
    name: go test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Plain `go test ./...` already excludes internal/mcpclient's own
      # //go:build live file, which spawns a real macula-mcp subprocess
      # over npx and needs live mesh access -- not something to run
      # unattended in CI. Everything else (config, provider's DeepSeek
      # wire format via httptest, agent's tool-calling loop via fakes,
      # tui's mesh-state parsing against real captured JSON fixtures) is
      # a real offline test, not a stub.
      - run: go test ./...
